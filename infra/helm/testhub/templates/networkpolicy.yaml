{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "testhub.fullname" . }}-api-ingress
  labels:
    {{- include "testhub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "testhub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "testhub.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: http
    {{- if .Values.networkPolicy.prometheus.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.prometheus.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.prometheus.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: http
    {{- end }}
{{- end }}
