nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

api:
  replicaCount: 2
  image:
    repository: registry.example.com/testhub/platform-api
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  existingSecret: testhub-runtime
  config:
    dbUrl: jdbc:mysql://mysql:3306/testhub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    dbUsername: testhub
    redisHost: redis
    redisPort: "6379"
    minioEndpoint: http://minio:9000
    minioBucket: testhub-files
    corsAllowedOrigins: https://testhub.example.com
    serverMaxThreads: "200"
    serverMinSpareThreads: "20"
    serverAcceptCount: "100"
    serverMaxConnections: "8192"
    serverConnectionTimeout: 10s
    dbPoolMaxSize: "20"
    dbPoolMinIdle: "5"
    dbConnectionTimeoutMs: "3000"
    dbValidationTimeoutMs: "1000"
    capacityBaselineRequestCount: "60"
    capacityBaselineConcurrency: "6"
    capacityBaselineP95LatencyMs: "500"
    capacityBaselineMaxErrorPercent: "1"
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 1536Mi
  podAnnotations: {}
  podLabels: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

web:
  replicaCount: 2
  image:
    repository: registry.example.com/testhub/web
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: testhub.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  additionalLabels: {}

networkPolicy:
  enabled: false
  prometheus:
    enabled: false
    namespaceSelector: {}
    podSelector: {}

revisionHistoryLimit: 10
