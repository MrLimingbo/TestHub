name: testhub

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: testhub
      MYSQL_USER: testhub
      MYSQL_PASSWORD: ${TESTHUB_DB_PASSWORD:?set TESTHUB_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${TESTHUB_DB_ROOT_PASSWORD:?set TESTHUB_DB_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--transaction-isolation=READ-COMMITTED"]
    volumes: ["testhub-mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utesthub", "-p${TESTHUB_DB_PASSWORD:?set TESTHUB_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${TESTHUB_REDIS_PASSWORD:?set TESTHUB_REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: ["testhub-redis:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$TESTHUB_REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      TESTHUB_REDIS_PASSWORD: ${TESTHUB_REDIS_PASSWORD:?set TESTHUB_REDIS_PASSWORD}
    restart: unless-stopped
    networks: [internal]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${TESTHUB_MINIO_ACCESS_KEY:?set TESTHUB_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${TESTHUB_MINIO_SECRET_KEY:?set TESTHUB_MINIO_SECRET_KEY}
    volumes: ["testhub-minio:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [internal]

  # Kept behind the "operations" profile; it never starts with the application stack.
  # The backup/recovery scripts invoke it only for a one-off MinIO object mirror.
  minio-client:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    profiles: [operations]
    environment:
      TESTHUB_MINIO_ENDPOINT: http://minio:9000
      TESTHUB_MINIO_ACCESS_KEY: ${TESTHUB_MINIO_ACCESS_KEY:?set TESTHUB_MINIO_ACCESS_KEY}
      TESTHUB_MINIO_SECRET_KEY: ${TESTHUB_MINIO_SECRET_KEY:?set TESTHUB_MINIO_SECRET_KEY}
      TESTHUB_MINIO_BUCKET: ${TESTHUB_MINIO_BUCKET:-testhub-files}
      MC_CONFIG_DIR: /tmp/mc
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  api:
    image: ${TESTHUB_PLATFORM_IMAGE:?set TESTHUB_PLATFORM_IMAGE}
    environment:
      TESTHUB_DB_URL: jdbc:mysql://mysql:3306/testhub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
      TESTHUB_DB_USERNAME: testhub
      TESTHUB_DB_PASSWORD: ${TESTHUB_DB_PASSWORD:?set TESTHUB_DB_PASSWORD}
      TESTHUB_REDIS_HOST: redis
      TESTHUB_REDIS_PORT: "6379"
      TESTHUB_REDIS_PASSWORD: ${TESTHUB_REDIS_PASSWORD:?set TESTHUB_REDIS_PASSWORD}
      TESTHUB_MINIO_ENDPOINT: http://minio:9000
      TESTHUB_MINIO_ACCESS_KEY: ${TESTHUB_MINIO_ACCESS_KEY:?set TESTHUB_MINIO_ACCESS_KEY}
      TESTHUB_MINIO_SECRET_KEY: ${TESTHUB_MINIO_SECRET_KEY:?set TESTHUB_MINIO_SECRET_KEY}
      TESTHUB_ENCRYPTION_KEY: ${TESTHUB_ENCRYPTION_KEY:?set TESTHUB_ENCRYPTION_KEY}
      TESTHUB_ENCRYPTION_KEY_ID: ${TESTHUB_ENCRYPTION_KEY_ID:?set TESTHUB_ENCRYPTION_KEY_ID}
      TESTHUB_PREVIOUS_ENCRYPTION_KEYS: ${TESTHUB_PREVIOUS_ENCRYPTION_KEYS:-}
      TESTHUB_SECRET_REKEY_ENABLED: "${TESTHUB_SECRET_REKEY_ENABLED:-false}"
      TESTHUB_CAPACITY_BASELINE_REQUEST_COUNT: "${TESTHUB_CAPACITY_BASELINE_REQUEST_COUNT:-60}"
      TESTHUB_CAPACITY_BASELINE_CONCURRENCY: "${TESTHUB_CAPACITY_BASELINE_CONCURRENCY:-6}"
      TESTHUB_CAPACITY_BASELINE_P95_LATENCY_MS: "${TESTHUB_CAPACITY_BASELINE_P95_LATENCY_MS:-500}"
      TESTHUB_CAPACITY_BASELINE_MAX_ERROR_PERCENT: "${TESTHUB_CAPACITY_BASELINE_MAX_ERROR_PERCENT:-1}"
      TESTHUB_SERVER_MAX_THREADS: "${TESTHUB_SERVER_MAX_THREADS:-200}"
      TESTHUB_SERVER_MIN_SPARE_THREADS: "${TESTHUB_SERVER_MIN_SPARE_THREADS:-20}"
      TESTHUB_SERVER_ACCEPT_COUNT: "${TESTHUB_SERVER_ACCEPT_COUNT:-100}"
      TESTHUB_SERVER_MAX_CONNECTIONS: "${TESTHUB_SERVER_MAX_CONNECTIONS:-8192}"
      TESTHUB_SERVER_CONNECTION_TIMEOUT: "${TESTHUB_SERVER_CONNECTION_TIMEOUT:-10s}"
      TESTHUB_DB_POOL_MAX_SIZE: "${TESTHUB_DB_POOL_MAX_SIZE:-20}"
      TESTHUB_DB_POOL_MIN_IDLE: "${TESTHUB_DB_POOL_MIN_IDLE:-5}"
      TESTHUB_DB_CONNECTION_TIMEOUT_MS: "${TESTHUB_DB_CONNECTION_TIMEOUT_MS:-3000}"
      TESTHUB_DB_VALIDATION_TIMEOUT_MS: "${TESTHUB_DB_VALIDATION_TIMEOUT_MS:-1000}"
      TESTHUB_SECURE_COOKIE: "true"
      TESTHUB_CORS_ALLOWED_ORIGINS: ${TESTHUB_CORS_ALLOWED_ORIGINS:?set TESTHUB_CORS_ALLOWED_ORIGINS}
    expose: ["8080"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=256m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1536m
    restart: unless-stopped
    networks: [internal]

  web:
    image: ${TESTHUB_WEB_IMAGE:?set TESTHUB_WEB_IMAGE}
    ports: ["${TESTHUB_HTTP_PORT:-8080}:8080"]
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=16m", "/var/cache/nginx:noexec,nosuid,size=16m", "/var/run:noexec,nosuid,size=8m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    restart: unless-stopped
    depends_on: [api]
    networks: [edge, internal]

  # Opt-in only: monitoring stays inside the private Compose network and has no host port.
  # Configure Alertmanager outside this file so notification credentials never enter the stack manifest.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [operations]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle=false
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/testhub-alerts.yml:/etc/prometheus/rules/testhub-alerts.yml:ro
      - testhub-prometheus:/prometheus
    depends_on:
      api:
        condition: service_started
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=32m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
    networks: [internal]

volumes:
  testhub-mysql:
  testhub-redis:
  testhub-minio:
  testhub-prometheus:

networks:
  edge: {}
  internal:
    internal: true
