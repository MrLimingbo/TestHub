# Experimental local database profile. Desktop process/queue management is implemented separately.
# Always use a new, dedicated data directory; never point this profile at an enterprise MySQL database.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:file:${testhub.desktop.data-directory}/workspace;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ${TESTHUB_LOCAL_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  flyway:
    locations: classpath:db/desktop
server:
  address: 127.0.0.1
testhub:
  desktop:
    allowed-origins: ${TESTHUB_DESKTOP_ALLOWED_ORIGINS:}
    broker-key: ${TESTHUB_DESKTOP_BROKER_KEY:}
    data-directory: ${TESTHUB_DESKTOP_DATA_DIRECTORY}
  bootstrap:
    demo-enabled: false
  storage:
    type: filesystem
    directory: ${testhub.desktop.data-directory}/objects
