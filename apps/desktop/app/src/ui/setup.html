<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'none'; connect-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>TestHub · 连接服务器</title>
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <main class="card">
      <div class="mark">T</div>
      <p class="eyebrow">TESTHUB DESKTOP</p>
      <h1>选择工作区</h1>
      <p class="description">本地工作区无需注册，数据保存在这台电脑。连接在线服务后，可以注册或登录该服务的账号；本地数据不会自动上传。</p>
      <button id="local" type="button">进入本地工作区</button>
      <p id="local-status" class="hint" role="status"></p>
      <button id="recover-backup" type="button" hidden>从备份恢复本地工作区…</button>
      <form id="server-form">
        <label for="server-url">服务地址</label>
        <input id="server-url" name="server-url" type="url" inputmode="url" autocomplete="url" placeholder="https://你的 TestHub 服务地址" required />
        <p class="hint">填写自己的账号服务或企业服务地址。线上服务使用 HTTPS；本机网页服务可以使用 localhost 地址。</p>
        <p id="error" class="error" role="alert" hidden></p>
        <button id="connect" type="submit">连接账号或企业服务</button>
      </form>
    </main>
    <script src="setup-renderer.js"></script>
  </body>
</html>
