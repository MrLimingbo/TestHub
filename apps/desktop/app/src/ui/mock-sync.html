<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>TestHub · Mock 服务与规则同步</title><link rel="stylesheet" href="setup.css" /><link rel="stylesheet" href="settings-sync.css" />
</head>
<body><main class="card">
  <h1>Mock 服务与规则同步</h1><p class="description">离线时在本地编辑Mock 服务与规则；联网后与绑定账号的网页端同步资料定义。</p>
  <p id="status" role="status" aria-live="polite">正在读取同步状态…</p>
  <p id="error" class="error" role="alert" hidden></p>
  <form id="bind-form" hidden>
    <p id="account" class="hint"></p>
    <label for="source">本地项目</label><select id="source" required></select>
    <label for="target">账号项目</label><select id="target" required></select>
    <p class="hint">按服务名和规则名匹配，内容不同需选择。名称大小写不同需先手动统一。公开密钥、分享、启停和智能示例来源保留各端；新服务及新规则停用。删除不传播。最多 20 个服务，每服务 200 条规则，资料不超过 3 MiB。</p>
    <p class="hint">请求匹配条件、响应头和正文会发送到所选账号服务，请核对其中的业务信息。已启用的现有规则未来将使用同步后的定义。</p>
    <p id="preview" role="status" aria-live="polite"></p>
    <button id="prepare" type="submit">预览绑定</button><button id="bind" type="button" disabled>确认绑定并同步</button>
  </form>
  <section id="bound" hidden>
    <p id="binding" class="hint"></p><p id="last-sync" class="hint"></p>
    <p class="hint">只同步服务名称及规则定义；公开密钥、分享和启停保持独立，已启用规则未来将使用同步后的定义。</p>
    <button id="run" type="button">立即同步</button><button id="toggle" type="button">暂停同步</button>
    <div id="conflicts" aria-live="polite"></div><button id="unbind" type="button">解除绑定（保留两端资料）</button>
  </section>
  <button id="refresh" type="button">刷新状态</button>
</main><script src="mock-sync.js"></script></body>
</html>
