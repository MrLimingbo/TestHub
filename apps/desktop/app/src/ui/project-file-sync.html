<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>TestHub · 项目文件同步</title>
  <link rel="stylesheet" href="setup.css"><link rel="stylesheet" href="settings-sync.css"><link rel="stylesheet" href="project-file-sync.css">
</head>
<body><main class="card">
  <h1>项目文件同步</h1>
  <p class="description">把绑定项目的文件内容双向复制。本地可继续上传和下载；联网后自动补齐新文件。</p>
  <p id="status" role="status" aria-live="polite">正在读取同步状态…</p>
  <p id="error" class="error" role="alert" hidden></p>
  <form id="bind-form" hidden>
    <p id="account" class="hint"></p>
    <label for="source">本地项目</label><select id="source" required></select>
    <label for="target">账号项目</label><select id="target" required></select>
    <p class="hint">先读取两端已有文件，逐一确认同一文件的对应关系。文件名相同不代表内容相同；不同内容不能配对。未配对文件会作为独立文件复制，不覆盖同名文件。</p>
    <button id="load-files" type="button">读取已有文件</button>
    <div id="file-pairs" aria-label="已有文件对应关系"></div>
    <p class="hint">单文件最多 20 MiB、每项目最多 1000 个。已同步文件若在一端删除或重建，该文件会暂停，另一端保留；其他新文件继续同步。正文中的文件下载链接仍需独立迁移和核对。</p>
    <p id="preview" role="status" aria-live="polite"></p>
    <button id="prepare" type="submit">预览绑定</button><button id="bind" type="button" disabled>确认绑定并同步</button>
  </form>
  <section id="bound" hidden>
    <p id="binding" class="hint"></p><p id="last-sync" class="hint"></p><p id="paired-summary" class="hint"></p>
    <p class="hint">运行时每 30 秒检查新文件。删除或重建已同步文件不会传播删除；需要人工核对后解除绑定并重新确认已有文件。解除绑定会清除本机对应记录，但保留两端文件。</p>
    <button id="run" type="button">立即同步</button><button id="toggle" type="button">暂停同步</button>
    <div id="conflicts" aria-live="polite"></div><button id="unbind" type="button">解除绑定（保留文件）</button>
  </section>
  <button id="refresh" type="button">刷新状态</button>
</main><script src="project-file-sync.js"></script></body>
</html>
