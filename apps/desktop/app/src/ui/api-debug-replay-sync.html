<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" /><title>TestHub · 脱敏重放草稿同步</title><link rel="stylesheet" href="setup.css" /><link rel="stylesheet" href="settings-sync.css" /><link rel="stylesheet" href="mobile-automation-history-sync.css" /></head>
<body><main class="card"><h1>脱敏重放草稿同步</h1><p class="description">先完成对应历史同步，再独立确认脱敏模板。原稿保留，目标补齐后手动发送。</p><p id="status" role="status" aria-live="polite">正在读取同步状态…</p><p id="error" class="error" role="alert" hidden></p>
<form id="bind-form" hidden><p id="account" class="hint"></p><label for="source">本地项目</label><select id="source" required></select><label for="target">账号项目</label><select id="target" required></select>
<p class="hint">脱敏模板仍可能包含业务请求内容。认证、Cookie 和敏感字段转为占位符；环境、项目文件、gRPC 本端引用需要目标核对。非 JSON 正文、GraphQL 查询和 XML 需要重新补齐。</p><label for="confirm-files"><input id="confirm-files" type="checkbox" required /> 我确认将脱敏重放模板（可能含业务数据）同步到所选账号项目。</label><p class="hint">最多 1000 条、单项 1 MiB；每轮最多 20 条。不同副本或记录缺失暂停，不删除或重建。</p><p id="preview" role="status" aria-live="polite"></p><button id="prepare" type="submit">预览绑定</button><button id="bind" type="button" disabled>确认绑定并同步</button></form>
<section id="bound" hidden><p id="binding" class="hint"></p><p id="last-sync" class="hint"></p><p class="hint">请在接口测试的“同步历史与模板”中查看。载入模板不会发送请求，必须核对并补齐后手动发送。暂停或解除保留两端记录。</p><button id="run" type="button">立即同步</button><button id="toggle" type="button">暂停同步</button><div id="conflicts" aria-live="polite"></div><button id="unbind" type="button">解除绑定（保留两端记录）</button></section><button id="refresh" type="button">刷新状态</button></main><script src="api-debug-replay-sync.js"></script></body></html>
