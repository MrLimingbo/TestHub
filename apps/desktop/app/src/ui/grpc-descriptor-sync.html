<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" /><title>TestHub · gRPC 描述文件同步</title><link rel="stylesheet" href="setup.css" /><link rel="stylesheet" href="settings-sync.css" /><link rel="stylesheet" href="mobile-automation-history-sync.css" /></head>
<body><main class="card"><h1>gRPC 描述文件同步</h1><p class="description">独立确认后双向复制编译后的描述文件，保留已有描述符和接口用例。</p><p id="status" role="status" aria-live="polite">正在读取同步状态…</p><p id="error" class="error" role="alert" hidden></p>
<form id="bind-form" hidden><p id="account" class="hint"></p><label for="source">本地项目</label><select id="source" required></select><label for="target">账号项目</label><select id="target" required></select>
<p class="hint">编译后的描述文件可能包含业务接口定义、注释及自定义选项，按原字节传输；不额外复制原始 Proto 源文件、账号认证配置或调试历史。最多 20 个、单个 1 MiB、合计 4 MiB。</p><label for="confirm-files"><input id="confirm-files" type="checkbox" required /> 我确认传输编译后的 gRPC 描述文件，并核对相同名称和摘要的已有描述符。</label>
<p class="hint">同名且内容不同、已同步文件删除或重建时暂停，不覆盖或重建。接口用例另通过接口设计资料同步，只有已核对的描述符才能映射两端 ID。</p><p id="preview" role="status" aria-live="polite"></p><button id="prepare" type="submit">预览绑定</button><button id="bind" type="button" disabled>确认绑定并同步</button></form>
<section id="bound" hidden><p id="binding" class="hint"></p><p id="last-sync" class="hint"></p><p class="hint">请在快捷请求的 gRPC 离线描述符中查看和发现服务。同名不同内容请使用新名称导入。暂停或解除保留两端记录；关联用例暂停同步。</p><button id="run" type="button">立即同步</button><button id="toggle" type="button">暂停同步</button><div id="conflicts" aria-live="polite"></div><button id="unbind" type="button">解除绑定（保留两端描述符）</button></section><button id="refresh" type="button">刷新状态</button></main><script src="grpc-descriptor-sync.js"></script></body></html>
