<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" /><title>TestHub · 接口调试历史同步</title><link rel="stylesheet" href="setup.css" /><link rel="stylesheet" href="settings-sync.css" /><link rel="stylesheet" href="mobile-automation-history-sync.css" /></head>
<body><main class="card"><h1>接口调试历史同步</h1><p class="description">独立绑定后双向复制只读历史摘要。原有请求和草稿保留。</p><p id="status" role="status" aria-live="polite">正在读取同步状态…</p><p id="error" class="error" role="alert" hidden></p>
<form id="bind-form" hidden><p id="account" class="hint"></p><label for="source">本地项目</label><select id="source" required></select><label for="target">账号项目</label><select id="target" required></select>
<p class="hint">历史只传方法、协议、状态、时间、计量和目标主机，路径、查询值、认证、正文及错误原文不传。此绑定不会自动启用模板。</p><label for="confirm-files"><input id="confirm-files" type="checkbox" required /> 我确认将只读调试历史摘要同步到所选账号项目。</label><p class="hint">最多 1000 条、单项 1 MiB；每轮最多 20 条。不同副本或记录缺失暂停，不删除或重建。</p><p id="preview" role="status" aria-live="polite"></p><button id="prepare" type="submit">预览绑定</button><button id="bind" type="button" disabled>确认绑定并同步</button></form>
<section id="bound" hidden><p id="binding" class="hint"></p><p id="last-sync" class="hint"></p><p class="hint">请在接口测试的“同步历史与模板”中查看。载入模板不会发送请求，必须核对并补齐后手动发送。暂停或解除保留两端记录。</p><button id="run" type="button">立即同步</button><button id="toggle" type="button">暂停同步</button><div id="conflicts" aria-live="polite"></div><button id="unbind" type="button">解除绑定（保留两端记录）</button></section><button id="refresh" type="button">刷新状态</button></main><script src="api-debug-history-sync.js"></script></body></html>
