<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" /><title>TestHub · 质量报告计划同步</title><link rel="stylesheet" href="setup.css" /><link rel="stylesheet" href="settings-sync.css" /></head>
<body><main class="card"><h1>质量报告计划同步</h1><p class="description">只同步计划配置，新副本和收到变更的目标计划先停用，核对后手动启用。</p><p id="status" role="status" aria-live="polite">正在读取…</p><p id="error" class="error" role="alert" hidden></p>
<form id="bind-form" hidden><p id="account" class="hint"></p><label for="source">本地绑定项目</label><select id="source" required></select><label for="target">账号绑定项目</label><select id="target" required></select><h2>其他项目对应关系</h2><p class="hint">绑定项目自动对应上方两项。跨项目计划的其他项目须逐一配对；只能选择各端相应组织的已有项目，不会创建或按同名自动合并项目。</p><div id="project-links"></div><button type="button" id="add-link">添加项目对应</button><label for="confirm-projects"><input id="confirm-projects" type="checkbox" required /> 我已核对项目对应关系，同意同步计划配置；目标变更后先停用。</label><p class="hint">同步名称、项目范围、Cron、时区和统计周期。不传运行历史／统计结果，不生成报告或投递通知。未配对、缺失和重建的资料暂停。每组织最多 1000 个计划，每计划最多 50 个项目，每轮最多 20 项。</p><pre id="preview" role="status" aria-live="polite"></pre><button id="prepare" type="submit">预览绑定</button><button id="bind" type="button" disabled>确认绑定并同步</button></form>
<section id="bound" hidden><p id="binding" class="hint"></p><p id="last-sync" class="hint"></p><p class="hint">收到配置变更的目标计划先停用，请在报表统计页面核对后手动启用；没有配置变化时保留各端启用状态。已有运行记录保留。</p><button id="run" type="button">立即同步</button><button id="toggle" type="button">暂停同步</button><div id="conflicts" aria-live="polite"></div><button id="unbind" type="button">解除绑定（保留两端计划）</button></section><button id="refresh" type="button">刷新状态</button></main><script src="quality-report-sync.js"></script></body></html>
