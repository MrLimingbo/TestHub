name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:test
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: node scripts/desktop/verify-signing.mjs mac
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: pnpm --filter @testhub/desktop package:mac:signed
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        run: pnpm desktop:package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: TestHub-macOS
          path: release/desktop/TestHub.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:test
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: node scripts/desktop/verify-signing.mjs win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: pnpm desktop:package:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        run: pnpm desktop:package:win
      - uses: actions/upload-artifact@v4
        with:
          name: TestHub-Windows
          path: release/desktop/TestHub.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/TestHub.dmg
            release/TestHub.exe
          generate_release_notes: true
