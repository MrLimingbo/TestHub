name: testhub

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: testhub
      MYSQL_USER: testhub
      MYSQL_PASSWORD: testhub_dev_password
      MYSQL_ROOT_PASSWORD: testhub_root_password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --transaction-isolation=READ-COMMITTED
    ports:
      - "13307:3306"
    volumes:
      - testhub-mysql:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utesthub", "-ptesthub_dev_password"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "testhub_redis_password", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - testhub-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "testhub_redis_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: testhub
      MINIO_ROOT_PASSWORD: testhub_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - testhub-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  testhub-mysql:
  testhub-redis:
  testhub-minio:
