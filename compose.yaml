name: testhub

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: testhub
      MYSQL_USER: testhub
      MYSQL_PASSWORD: testhub_dev_password
      MYSQL_ROOT_PASSWORD: testhub_root_password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --transaction-isolation=READ-COMMITTED
    ports:
      - "13307:3306"
    volumes:
      - testhub-mysql:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utesthub", "-ptesthub_dev_password"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "testhub_redis_password", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - testhub-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "testhub_redis_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: testhub
      MINIO_ROOT_PASSWORD: testhub_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - testhub-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-runner:
    profiles: ["runner"]
    build:
      context: .
      dockerfile: services/api-runner/Dockerfile
    environment:
      TESTHUB_REDIS_URL: redis://:testhub_redis_password@redis:6379/0
      RUNNER_ID: api-runner-compose
      RUNNER_VERSION: 0.1.0
      RUNNER_HEARTBEAT_INTERVAL_SECONDS: 10
      RUNNER_HEARTBEAT_TTL_SECONDS: 30
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped

  jmeter-runner:
    profiles: ["runner"]
    build:
      context: .
      dockerfile: services/jmeter-runner/Dockerfile
    environment:
      TESTHUB_REDIS_URL: redis://:testhub_redis_password@redis:6379/0
      RUNNER_ID: jmeter-runner-compose
      RUNNER_VERSION: 0.1.0
      RUNNER_HEARTBEAT_INTERVAL_SECONDS: 10
      RUNNER_HEARTBEAT_TTL_SECONDS: 30
      RUNNER_MAX_CONCURRENT_TASKS: 1
      RUNNER_TASK_CLAIM_IDLE_SECONDS: 45
      PERFORMANCE_RUNNER_HEARTBEAT_KEY: testhub-performance-runner-local-development-key-2026
      # Keep disabled until the deployment injects a control-plane URL and explicit target-origin allow list.
      RUNNER_JMETER_EXECUTION_ENABLED: "false"
      TESTHUB_CONTROL_PLANE_URL: ${TESTHUB_PERFORMANCE_RUNNER_CONTROL_PLANE_URL:-}
      RUNNER_ALLOWED_TARGET_ORIGINS: ${TESTHUB_PERFORMANCE_RUNNER_ALLOWED_TARGET_ORIGINS:-}
      JMETER_BIN: /usr/local/bin/jmeter
      RUNNER_WORK_DIRECTORY: /tmp/testhub-jmeter-runner
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped

volumes:
  testhub-mysql:
  testhub-redis:
  testhub-minio:
